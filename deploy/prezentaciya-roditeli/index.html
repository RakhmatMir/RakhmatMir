<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Школьный портал — презентация для родителей (слайды)" />
  <title>Школьный портал — для родителей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <base id="site-base" href="./" />
  <link rel="stylesheet" href="css/slider.css?v=2" />
</head>
<body>
  <p class="slider-kicker">Для родителей · школьный портал</p>

  <div class="slider-app">
    <button type="button" class="slider-nav prev" id="btn-prev" aria-label="Предыдущий слайд">‹</button>

    <div class="slider-frame">
      <div class="reel-caption slider-caption">
        <p class="caption-text" id="slide-caption"></p>
      </div>
      <div class="slider-media" id="slide-media"></div>
      <div class="slider-meta">
        <span id="slide-counter">1 / 8</span>
        <div class="slider-dots" id="slide-dots"></div>
        <span>← → на клавиатуре</span>
      </div>
    </div>

    <button type="button" class="slider-nav next" id="btn-next" aria-label="Следующий слайд">›</button>
  </div>

  <script src="js/slider.js?v=1"></script>
</body>
</html>
