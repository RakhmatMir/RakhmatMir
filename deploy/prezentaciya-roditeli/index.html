<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Школьный портал — слайды как в ролике (без видео)" />
  <title>Школьный портал — для родителей</title>
  <base id="site-base" href="./" />
  <link rel="stylesheet" href="css/brag-slider.css?v=2" />
  <script>
    (function () {
      var base = document.getElementById("site-base");
      var assetBase = "https://cdn.jsdelivr.net/gh/RakhmatMir/RakhmatMir@main/deploy/prezentaciya-roditeli/";
      if (
        location.hostname.includes("jsdelivr.net") ||
        location.hostname.includes("githubusercontent.com") ||
        location.hostname.includes("htmlpreview.github.io")
      ) {
        base.href = assetBase;
      }
    })();
  </script>
</head>
<body class="brag-slider">
  <div id="stage">
    <div class="caption" id="cap"></div>
    <div class="monitor-wrap" id="mon">
      <div class="monitor">
        <div class="screen" id="scr"></div>
      </div>
    </div>
    <div class="cta hidden" id="cta"></div>
  </div>

  <div class="player" id="player">
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="player-controls">
      <button type="button" class="nav-btn" id="btn-prev" title="Предыдущий слайд">‹ Назад</button>
      <button type="button" class="nav-btn primary" id="btn-next" title="Следующий слайд">Вперёд ›</button>
      <span class="time-label" id="time-label">Слайд 1 / 6</span>
      <button type="button" class="icon-btn ghost" id="btn-restart" title="С первого слайда">↺</button>
    </div>
  </div>

  <script src="js/brag-slider.js?v=2"></script>
</body>
</html>
