name: Deploy Foundation School (GitHub Pages)

on:
  push:
    branches: [school-test-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: VITE_PAGES_DEMO=true bunx vite build --base /RakhmatMir/school/
      - run: cp dist/client/index.html dist/client/404.html && touch dist/client/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/client
          publish_branch: gh-pages
          destination_dir: school
