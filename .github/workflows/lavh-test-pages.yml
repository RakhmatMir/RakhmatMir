name: Publish LAVH TEST demo (gh-pages)

on:
  push:
    branches: [main]
    paths:
      - "lavh-test/**"
      - ".github/workflows/lavh-test-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lavh-test-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r lavh-test/. _site/
          touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
