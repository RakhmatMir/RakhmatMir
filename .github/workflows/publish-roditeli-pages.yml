name: Publish roditeli slider (gh-pages)

on:
  push:
    branches: [main]
    paths:
      - "deploy/prezentaciya-roditeli/**"
      - ".github/workflows/publish-roditeli-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roditeli-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy/prezentaciya-roditeli
          branch: gh-pages
          clean: true
