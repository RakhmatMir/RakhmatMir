name: Publish roditeli preview (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "deploy/prezentaciya-roditeli/**"
      - ".github/workflows/publish-roditeli-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: roditeli-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/prezentaciya-roditeli
      - uses: actions/deploy-pages@v4
        id: deployment
