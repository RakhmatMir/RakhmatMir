<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: Montserrat, sans-serif; }
#stage {
  width: 1920px; height: 1080px;
  background: linear-gradient(180deg, #4dd0e1 0%, #26c6da 35%, #ff9999 70%, #ffab91 100%);
  position: relative;
}
.caption {
  position: absolute; top: 48px; left: 80px; right: 80px;
  background: #e53935; color: #fff; text-align: center;
  padding: 28px 36px; border-radius: 14px; font-weight: 800;
  font-size: 46px; line-height: 1.2;
  box-shadow: 0 12px 40px rgba(0,0,0,.2);
  opacity: 0; transform: scale(.92);
}
.monitor-wrap {
  position: absolute; left: 50%; top: 250px; transform: translateX(-50%);
  width: 920px;
}
.monitor {
  background: #0d0d0d; border-radius: 18px; padding: 14px;
  box-shadow: 0 30px 80px rgba(0,0,0,.35);
}
.screen {
  background: #e4e9f0; border-radius: 10px; height: 520px; overflow: hidden;
  padding: 16px; font-family: "Segoe UI", sans-serif; color: #101828;
  position: relative;
}
.panel { background:#f6f8fb;border:1px solid #b8c4d4;border-radius:12px;padding:14px;margin-bottom:10px;font-size:22px; }
.bar { font-size:20px;font-weight:650;margin-bottom:10px; }
.meta { color:#475467;font-size:18px; }
.btn { background:#2563eb;color:#fff;text-align:center;padding:12px;border-radius:10px;font-weight:600;margin-top:10px;font-size:20px; }
.row { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #dce3ed;font-size:20px; }
.metrics { display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px; }
.metrics div { background:#f6f8fb;border:1px solid #b8c4d4;border-radius:8px;padding:10px;text-align:center; }
.metrics strong { display:block;font-size:28px; }
.chips { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:40px; }
.chip { background:rgba(255,255,255,.92); padding:20px 28px; border-radius:12px; font-weight:700; font-size:28px; }
.cta { position:absolute; bottom:70px; left:0; right:0; text-align:center; font-size:34px; font-weight:800; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.25); opacity:0; }
</style>
</head>
<body>
<div id="stage">
  <div class="caption" id="cap"></div>
  <div class="monitor-wrap" id="mon">
    <div class="monitor"><div class="screen" id="scr"></div></div>
  </div>
  <div class="chips" id="chips" style="display:none"></div>
  <div class="cta" id="cta"></div>
</div>
<script>
const D = 20000;
const scenes = [
  { t0: 0, t1: 3200, cap: "Школьный портал — контрольные онлайн", render: login },
  { t0: 3200, t1: 6400, cap: "Меньше бумаги — больше времени учителю", render: problem },
  { t0: 6400, t1: 9600, cap: "Ученик видит баллы сразу · класс 6Б", render: student },
  { t0: 9600, t1: 12800, cap: "Учитель ведёт класс: 18 учеников, 3 теста", render: teacher },
  { t0: 12800, t1: 16000, cap: "18 из 18 сдали — сложные вопросы видны", render: analytics },
  { t0: 16000, t1: D, cap: "Готовы показать вашей школе", render: cta },
];
function login() {
  return `<div class="panel" style="max-width:420px;margin:40px auto;text-align:center">
    <div class="bar" style="font-size:32px">Школа</div><p class="meta">Вход для администрации и учеников</p>
    <p class="meta" style="margin-top:20px;text-align:left">Логин</p><div class="panel" style="padding:10px">6b01</div>
    <p class="meta" style="text-align:left">Пароль</p><div class="panel" style="padding:10px">••••••••</div>
    <div class="btn">Войти</div></div>`;
}
function problem() {
  return `<div class="chips" style="display:flex;flex-direction:column;gap:16px;margin-top:60px">
    <div class="chip" style="background:#1e1e1e;color:#fff;font-size:32px">3+ часа на одну контрольную</div>
    <div class="chip" style="background:#1e1e1e;color:#fff;font-size:32px">Нет аналитики по вопросам</div></div>`;
}
function student() {
  return `<div class="bar">Портал · демо · класс 6Б</div>
    <div class="panel"><strong>Все тесты сданы</strong><div class="meta">Математика 75% · Английский 60% · Русский 40%</div></div>
    <div class="row"><span>Общий средний балл</span><strong>58%</strong></div>`;
}
function teacher() {
  return `<div class="bar">Класс 6Б</div><div class="meta">18 уч. · 3 тест. · опубликованы</div>
    <div class="panel" style="margin-top:12px">Общее время <strong>45 мин</strong> → 15 мин на тест</div>
    <div class="meta" style="margin-top:8px">Математика · Русский · Английский</div>`;
}
function analytics() {
  return `<div class="metrics"><div><span class="meta">Сдали</span><strong>18</strong></div><div><span class="meta">Из</span><strong>18</strong></div><div><span class="meta">Ср.время</span><strong>5:06</strong></div><div><span class="meta">Выход</span><strong>5</strong></div></div>
    <div class="panel"><strong>Сложные вопросы</strong><div class="row"><span>Периметр 5×9</span><span style="color:#dc2626">100%</span></div></div>`;
}
function cta() {
  return `<div style="text-align:center;margin-top:120px;font-size:36px;font-weight:800">Образовательный портал</div>
    <div class="btn" style="max-width:520px;margin:20px auto;font-size:24px">Подключим ваши классы</div>`;
}
function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3); }
function lerp(a,b,t){ return a+(b-a)*t; }
window.seekTo = function(ms) {
  ms = Math.max(0, Math.min(D, ms));
  const sc = scenes.find(s => ms >= s.t0 && ms < s.t1) || scenes[scenes.length-1];
  const local = (ms - sc.t0) / (sc.t1 - sc.t0);
  const enter = ease(Math.min(1, local * 4));
  const exit = ease(Math.max(0, (local - 0.82) / 0.18));
  const cap = document.getElementById('cap');
  cap.textContent = sc.cap;
  cap.style.opacity = enter * (1 - exit);
  cap.style.transform = `scale(${lerp(0.92, 1, enter)})`;
  document.getElementById('scr').innerHTML = sc.render();
  document.getElementById('mon').style.opacity = enter * (1 - exit);
  document.getElementById('mon').style.transform = `translateX(-50%) translateY(${lerp(24, 0, enter)}px)`;
  const ctaEl = document.getElementById('cta');
  if (ms > 16000) {
    ctaEl.textContent = 'Подключим вашу школу · демо';
    ctaEl.style.opacity = ease((ms - 16000) / 800);
  } else ctaEl.style.opacity = 0;
};
window.seekTo(0);
</script>
</body>
</html>
